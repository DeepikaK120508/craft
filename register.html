<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register – CRAFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Create your account</h1>
<div class="notice">Stage 1: forms are validated, but registration is connected to Firebase in Stage 3.</div>
<form class="form card" id="register-form" novalidate>
  <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required><div class="field-error" data-error-for="name"></div></div>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div class="field-error" data-error-for="email"></div></div>
  <div class="field"><label for="password">Password (min 6 characters)</label><input id="password" name="password" type="password" autocomplete="new-password" required><div class="field-error" data-error-for="password"></div></div>
  <div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required><div class="field-error" data-error-for="confirm"></div></div>
  <button class="btn" type="submit">Create account</button>
  <p style="margin-top:1rem">Already registered? <a href="login.html">Log in</a></p>
</form>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/forms.js"></script>
</body>
</html>
